# --- Coarser tiers -----------------------------------------------------------
# Codes are hierarchical (`IN` > `IN-KA` > `IN-KA-BLR`) and the gate matches on
# prefixes, so a profile that lists only "Karnataka" is not ruled out for a
# Bangalore role, while one that lists "Punjab" is. Without these tiers a
# state-level location resolves to nothing and the location gate never fires.

IN: [India]

