[project]
name = "hiring-intelligence"
version = "0.1.0"
description = "Evidence-backed candidate shortlisting for a recruiting team"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary,pool]",
    "httpx",
    "selectolax",
    "pydantic",
    "pydantic-settings",
    "jinja2",
    "anthropic",
    "groq",
    "pyyaml",
    "python-multipart>=0.0.32",
    "playwright>=1.62.0",
    "linkedin-scraper",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
linkedin-scraper = { path = "linkedin_scraper", editable = true }
