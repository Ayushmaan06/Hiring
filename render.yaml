# Render blueprint: the web UI + SerpAPI discovery. Postgres lives on Neon.
# LinkedIn profile reading attaches to a local Edge window, so it cannot run here;
# the app degrades to "not looked at yet" for those people, which is by design.
services:
  - type: web
    name: hiring-intelligence
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync python -m hi.db migrate && uv run --no-sync uvicorn hi.web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: COOKIE_SECURE
        value: "true"
      # Secrets: Render asks for these on first deploy. Copy the values from your local .env.
      # DATABASE_URL: the Neon *direct* URL (host without "-pooler"). The job queue holds
      # row locks across statements, which a transaction-mode pooler does not guarantee.
      - key: DATABASE_URL
        sync: false
      - key: HI_USERS
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
